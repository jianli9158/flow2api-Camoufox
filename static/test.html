:root {
  --bg-canvas: #F8FAFC;
  --bg-surface: #FFFFFF;
  --bg-subtle: #F1F5F9;
  --bg-terminal: #0F172A;
  --border: #E2E8F0;
  --border-strong: #CBD5E1;
  --ink-primary: #0F172A;

* { margin: 0; padding: 0; box-sizing: border-box; }
body {

.top-nav {

.top-nav-inner {

  height: 56px;
  padding: 0 24px;

.brand-group {

}
.brand-title {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--ink-primary);
  text-decoration: none;
}
.brand-badge {
  font-size: 11px;
  font-weight: 500;
  padding: 2px 8px;

.nav-actions {

.nav-link {

.nav-link:hover {

.lang-select {

.config-bar {

.config-bar label { font-size: 12px; font-weight: 600; color: var(--ink-secondary); white-space: nowrap; text-transform: uppercase; letter-spacing: 0.03em; }
.config-bar input {

.config-bar input:focus { outline: none; border-color: var(--ink-primary); background: var(--bg-surface); }
.config-note { margin-bottom: 20px; font-size: 12px; color: var(--ink-muted); }

.main-layout { display: flex; gap: 20px; align-items: flex-start; }

.content { flex: 1; min-width: 0; }

.section-title {

.section-title .arrow { font-size: 10px; color: var(--ink-muted); transition: transform 0.2s; }

.model-list {

.model-list.hidden { display: none; }
.model-item {

.status-done { background: #10B981; }

<script>
    I18n.ready.then(() => {

// Normalize legacy underscore ids so both catalog styles classify identically.
function normalizeModelId(modelId) {
  return String(modelId).toLowerCase().replace(/_/g, "-");
}

// Model family determines reference inputs independently of output resolution.
function getModelFamily(modelId) {
  const norm = normalizeModelId(modelId);
  if (norm.includes("image")) return "image";
  if (norm.includes("i2v") || norm.includes("interpolation")) return "i2v";
  if (norm.includes("r2v")) return "r2v";
  if (norm.includes("omni") || norm.includes("abra")) return "omni";
  if (norm.includes("extend")) return "extend";
  return "t2v";
}

function classifyModel(modelId) {
  const family = getModelFamily(modelId);
  const norm = normalizeModelId(modelId);
  if (family !== "image" && (norm.includes("4k") || norm.includes("1080p"))) return "upsample";
  return family;
}

// Model categories for sidebar

let ALL_MODELS = {};

function applyFallbackModels(reason) {
  console.warn(I18n.t("使用内置候选模型列表:"), reason);
  ALL_MODELS = { ...FALLBACK_MODELS };
  renderSidebar();
}

async function loadModels() {
  const baseUrl = (document.getElementById("baseUrl").value || "").trim();
  const apiKey = (document.getElementById("apiKey").value || "").trim();
  if (!baseUrl || !apiKey) {
    applyFallbackModels("missing_base_url_or_api_key");
    return;
  }
  try {
    const resp = await fetch(`${baseUrl}/v1/models`, {
      headers: { ...I18n.headers(), "Authorization": `Bearer ${apiKey}` }
    });
    if (!resp.ok) {
      throw new Error(`HTTP ${resp.status}`);
    }
    const data = await resp.json();
    const items = Array.isArray(data.data) ? data.data : [];
    if (!items.length) {
      applyFallbackModels("empty_model_catalog");
      return;
    }
    ALL_MODELS = {};
    items.forEach(m => { ALL_MODELS[m.id] = m.description; });
    renderSidebar();
  } catch (e) {
    console.error(I18n.t("加载模型失败:"), e);
    applyFallbackModels(e.message || "load_failed");
  }
}

function renderSidebarFallback() {
  applyFallbackModels("legacy_fallback");
}

function getModelType(modelId) {
  return getModelFamily(modelId) === "image" ? "image" : "video";
}

function getModelMeta(modelId) {
  const family = getModelFamily(modelId);
  if (family === "image") return { type: "image", supportsImages: true, minImages: 0, maxImages: 5 };
  if (family === "i2v") return { type: "video", supportsImages: true, minImages: 1, maxImages: 2 };
  if (family === "r2v" || family === "omni") {
    return { type: "video", supportsImages: true, minImages: 0, maxImages: 3 };
  }
  if (family === "extend") {
    return { type: "video", supportsImages: false, minImages: 0, maxImages: 0, requiresVideoSource: true };
  }
  return { type: "video", supportsImages: false, minImages: 0, maxImages: 0 };
}

function renderSidebar() {
  const sidebar = document.getElementById("modelSidebar");
  sidebar.innerHTML = "";

  const modelIds = Object.keys(ALL_MODELS).sort();
  if (modelIds.length === 0) {
    sidebar.innerHTML = "<div class=\"model-section\"><div class=\"model-list\" style=\"border-radius:8px;\"><div class=\"model-item\" style=\"cursor:default;color:#64748B;\"><span data-i18n=\"未获取到可用模型，请检查 API Key 或稍后重试\">未获取到可用模型，请检查 API Key 或稍后重试</span></div></div></div>";
    return;
  }

  for (const [catName, catDef] of Object.entries(MODEL_CATEGORIES)) {
    const models = modelIds.filter(catDef.filter);
    if (models.length === 0) continue;

    const section = document.createElement("div");
    section.className = "model-section";

    const title = document.createElement("div");
    title.className = "section-title";
    title.dataset.category = catName;
    title.innerHTML = `<span>${I18n.t(catName)} (${models.length})</span><span class="arrow">▼</span>`;

    const list = document.createElement("div");
    list.className = "model-list";

    models.forEach(modelId => {
      const item = document.createElement("div");
      item.className = "model-item";
      item.dataset.model = modelId;
      item.classList.toggle("active", modelId === STATE.selectedModel);

      const type = getModelType(modelId);
      const shortName = modelId.replace("gemini-3.1-flash-image-", "").replace("gemini-3.1-flash-lite-image-", "").replace("gemini-3.0-pro-image-", "");
      item.innerHTML = `<span>${shortName}</span><span class="model-tag ${type === 'image' ? 'tag-image' : 'tag-video'}">${type === 'image' ? I18n.t("图片") : I18n.t("视频")}</span>`;
      item.onclick = () => selectModel(modelId);
      list.appendChild(item);
    });

    title.onclick = () => {
      title.classList.toggle("collapsed");
      list.classList.toggle("hidden");
    };

    section.appendChild(title);
    section.appendChild(list);
    sidebar.appendChild(section);
  }
}

function selectModel(modelId) {
  STATE.selectedModel = modelId;
  STATE.modelConfig = getModelMeta(modelId);
  STATE.images = [];

  document.querySelectorAll(".model-item").forEach(el => {
    el.classList.toggle("active", el.dataset.model === modelId);
  });

  I18n.setRawText(document.getElementById("selectedModelName"), modelId);
  I18n.setMessage(document.getElementById("selectedModelInfo"), ALL_MODELS[modelId] || "");

  const uploadGroup = document.getElementById("imageUploadGroup");
  const meta = STATE.modelConfig;
  if (meta.supportsImages) {
    uploadGroup.style.display = "block";
    const limitText = meta.type === "image" ? I18n.t("可选，用于图生图") : I18n.t("{0}-{1}张", {"0": (meta.minImages), "1": (meta.maxImages)});
    I18n.setRawText(document.getElementById("imageLimit"), `(${limitText})`);
  } else {
    uploadGroup.style.display = "none";
  }

  document.getElementById("videoSourceGroup").style.display = meta.requiresVideoSource ? "block" : "none";
  document.getElementById("videoMediaId").value = "";

  document.getElementById("imagePreviewList").innerHTML = "";
  document.getElementById("imageHint").style.display = "block";

  const btn = document.getElementById("btnGenerate");
  btn.disabled = false;
  I18n.setMessage(btn, meta.type === "image" ? I18n.t("🎨 生成图片") : I18n.t("🎬 生成视频"));
}

const uploadArea = document.getElementById("imageUploadArea");
const fileInput = document.getElementById("imageFileInput");

uploadArea.onclick = (e) => {
  if (e.target.closest(".remove-btn")) return;
  fileInput.click();
};

uploadArea.ondragover = (e) => { e.preventDefault(); uploadArea.style.borderColor = "#2563EB"; };
uploadArea.ondragleave = () => { uploadArea.style.borderColor = "#CBD5E1"; };
uploadArea.ondrop = (e) => {
  e.preventDefault();
  uploadArea.style.borderColor = "#CBD5E1";
  handleFiles(e.dataTransfer.files);
};

fileInput.onchange = () => { handleFiles(fileInput.files); fileInput.value = ""; };

function handleFiles(files) {
  const maxImages = STATE.modelConfig ? STATE.modelConfig.maxImages : 5;
  for (const file of files) {
    if (STATE.images.length >= maxImages) break;
    if (!file.type.startsWith("image/")) continue;

    const reader = new FileReader();
    reader.onload = (e) => {
      STATE.images.push(e.target.result);
      renderImagePreviews();
    };
    reader.readAsDataURL(file);
  }
}

function renderImagePreviews() {
  const list = document.getElementById("imagePreviewList");
  const hint = document.getElementById("imageHint");
  list.innerHTML = "";
  hint.style.display = STATE.images.length ? "none" : "block";

  STATE.images.forEach((dataUrl, idx) => {
    const item = document.createElement("div");
    item.className = "image-preview-item";
    item.innerHTML = `<img src="${dataUrl}" alt="preview"><button class="remove-btn" onclick="removeImage(${idx})">×</button>`;
    list.appendChild(item);
  });
}

function removeImage(idx) {
  STATE.images.splice(idx, 1);
  renderImagePreviews();
}

document.getElementById("btnGenerate").onclick = generate;

async function generate() {
  if (!STATE.selectedModel || STATE.generating) return;

  const baseUrl = (document.getElementById("baseUrl").value || "").trim();
  const apiKey = (document.getElementById("apiKey").value || "").trim();
  const prompt = document.getElementById("promptInput").value.trim();
  if (!prompt) { alert(I18n.t("请输入提示词")); return; }
  if (!apiKey) { alert(I18n.t("请输入 API Key")); return; }
  if (!baseUrl) { alert(I18n.t("请输入服务地址")); return; }
  const videoMediaId = STATE.modelConfig.requiresVideoSource
    ? document.getElementById("videoMediaId").value.trim() : "";
  if (STATE.modelConfig.requiresVideoSource && !videoMediaId) {
    alert(I18n.t("请输入源视频的 mediaGenerationId"));
    return;
  }

  STATE.generating = true;
  const btn = document.getElementById("btnGenerate");
  btn.disabled = true;
  I18n.setMessage(btn, I18n.t("⏳ 生成中..."));

  const dot = document.getElementById("statusDot");
  dot.className = "status-dot status-running";
  I18n.setMessage(document.getElementById("statusText"), I18n.t("生成中..."));
  I18n.setRawText(document.getElementById("outputLog"), "");
  document.getElementById("outputResult").innerHTML = "";

  const log = document.getElementById("outputLog");
  const appendLog = (text) => { log.textContent += text; log.scrollTop = log.scrollHeight; };

  const content = [];
  content.push({ type: "text", text: prompt });
  STATE.images.forEach(dataUrl => {
    content.push({ type: "image_url", image_url: { url: dataUrl } });
  });
  if (videoMediaId) {
    content.push({ type: "image_url", image_url: { url: `extend://${videoMediaId}` } });
  }

  const messages = [{ role: "user", content: content.length === 1 ? prompt : content }];
  const body = { model: STATE.selectedModel, messages, stream: true };

  const startTime = Date.now();
  appendLog(I18n.t("[{0}] 模型: {1}\n", {"0": (new Date().toLocaleTimeString(I18n.locale)), "1": (STATE.selectedModel)}));
  appendLog(I18n.t("[{0}] 提示词: {1}{2}\n", {"0": (new Date().toLocaleTimeString(I18n.locale)), "1": (prompt.substring(0, 100)), "2": (prompt.length > 100 ? '...' : '')}));
  appendLog(I18n.t("[{0}] 开始请求...\n", {"0": (new Date().toLocaleTimeString(I18n.locale))}));

  try {
    const resp = await fetch(`${baseUrl}/v1/chat/completions`, {
      method: "POST",
      headers: { ...I18n.headers(), "Authorization": `Bearer ${apiKey}`, "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });

    if (!resp.ok) {
      const errText = await resp.text();
      throw new Error(`HTTP ${resp.status}: ${errText}`);
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let fullContent = "";
    let buffer = "";

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split("\n");
      buffer = lines.pop() || "";

      for (const line of lines) {
        if (!line.startsWith("data: ")) continue;
        const data = line.slice(6).trim();
        if (data === "[DONE]") continue;

        try {
          const parsed = JSON.parse(data);
          if (parsed.error) {
            appendLog(I18n.t("\n❌ 错误: {0}\n", {"0": (JSON.stringify(parsed.error))}));
            continue;
          }
          const choices = parsed.choices || [];
          if (choices.length > 0) {
            const delta = choices[0].delta || {};
            if (delta.reasoning_content) appendLog(I18n.translateMessage(delta.reasoning_content));
            const content = delta.content || "";
            if (content) {
              fullContent += content;
              appendLog(content);
            }
          }
        } catch (e) {
        }
      }
    }

    const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
    appendLog(I18n.t("\n\n[{0}] 完成，耗时 {1}s\n", {"0": (new Date().toLocaleTimeString(I18n.locale)), "1": (elapsed)}));

    renderResult(fullContent);
    dot.className = "status-dot status-done";
    I18n.setMessage(document.getElementById("statusText"), I18n.t("完成 ({0}s)", {"0": (elapsed)}));

  } catch (e) {
    appendLog(I18n.t("\n❌ 请求失败: {0}\n", {"0": (e.message)}));
    dot.className = "status-dot status-error";
    I18n.setMessage(document.getElementById("statusText"), I18n.t("失败"));
  } finally {
    STATE.generating = false;
    btn.disabled = false;
    const meta = STATE.modelConfig;
    I18n.setMessage(btn, meta && meta.type === "image" ? I18n.t("🎨 生成图片") : I18n.t("🎬 生成视频"));
  }
}

function renderResult(content) {
  const resultDiv = document.getElementById("outputResult");
  resultDiv.innerHTML = "";

  const imgRegex = /!\[.*?\]\((.*?)\)/g;
  let match;
  while ((match = imgRegex.exec(content)) !== null) {
    const img = document.createElement("img");
    img.src = match[1];
    img.alt = I18n.t("生成结果");
    img.loading = "lazy";
    resultDiv.appendChild(img);
  }

  const videoRegex = /<video[^>]+src=['"]([^'"]+)['"]/gi;
  while ((match = videoRegex.exec(content)) !== null) {
    const video = document.createElement("video");
    video.src = match[1];
    video.controls = true;
    video.autoplay = true;
    video.loop = true;
    resultDiv.appendChild(video);
  }

  if (resultDiv.children.length === 0 && content.trim()) {
    const pre = document.createElement("pre");
    pre.style.cssText = "color:#334155;background:#F8FAFC;border:1px solid #E2E8F0;border-radius:8px;padding:12px;font-size:13px;white-space:pre-wrap;word-break:break-all;";
    I18n.setRawText(pre, content);
    resultDiv.appendChild(pre);
  }
}

(function() {
  const baseUrlInput = document.getElementById("baseUrl");
  const apiKeyInput = document.getElementById("apiKey");
  baseUrlInput.value = window.location.origin;
  baseUrlInput.addEventListener("change", loadModels);
  apiKeyInput.addEventListener("change", loadModels);
  loadModels();
})();

window.addEventListener('languagechange', () => {
  const collapsed = new Set(Array.from(document.querySelectorAll('.section-title.collapsed'), title => title.dataset.category));
  renderSidebar();
  document.querySelectorAll('.section-title').forEach(title => {
    if (collapsed.has(title.dataset.category)) {
      title.classList.add('collapsed');
      title.nextElementSibling.classList.add('hidden');
    }
  });
  if (!STATE.selectedModel) return;
  const meta = STATE.modelConfig;
  I18n.setMessage(document.getElementById('selectedModelInfo'), ALL_MODELS[STATE.selectedModel] || '');
  if (meta.supportsImages) {
    const limitText = meta.type === 'image' ? I18n.t('可选，用于图生图') : I18n.t('{0}-{1}张', {0: meta.minImages, 1: meta.maxImages});
    I18n.setRawText(document.getElementById('imageLimit'), `(${limitText})`);
  }
  I18n.setMessage(document.getElementById('btnGenerate'), STATE.generating ? I18n.t('⏳ 生成中...') : I18n.t(meta.type === 'image' ? '🎨 生成图片' : '🎬 生成视频'));
});
        Object.assign(window, {applyFallbackModels, loadModels, renderSidebarFallback, getModelType, getModelMeta, renderSidebar, selectModel, handleFiles, renderImagePreviews, removeImage, generate, renderResult});
    });
</script>
