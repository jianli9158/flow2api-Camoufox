[global]
api_key = "han1234"
admin_username = "admin"
admin_password = "admin"

[flow]
labs_base_url = "https://flow.google.com"
api_base_url = "https://flow.google.com"
timeout = 120
max_retries = 3
image_request_timeout = 40
image_timeout_retry_count = 1
image_timeout_retry_delay = 0.8
image_timeout_use_media_proxy_fallback = true
image_prefer_media_proxy = false
image_slot_wait_timeout = 480
image_launch_soft_limit = 20
image_launch_wait_timeout = 480
image_launch_stagger_ms = 0
video_slot_wait_timeout = 480
video_launch_soft_limit = 20
video_launch_wait_timeout = 480
video_launch_stagger_ms = 0
poll_interval = 3.0

[server]
host = "0.0.0.0"
port = 8000

[debug]
enabled = false
log_requests = true
log_responses = true
mask_token = true

[proxy]
proxy_enabled = false
proxy_url = ""

[generation]
image_timeout = 300
video_timeout = 1500

[call_logic]
call_mode = "default"  # default=随机轮询策略, polling=顺序轮询策略

[admin]
error_ban_threshold = 3

[cache]
enabled = false
timeout = 7200  # 缓存超时时间(秒), 默认2小时; 设置为0表示不自动删除缓存
base_url = ""   # 缓存文件访问的基础URL, 留空则使用服务器地址

[captcha]
captcha_method = "camoufox"  # Camoufox + WebDriver BiDi 原生浏览器模式
browser_engine = "camoufox"
browser_in_page_rpc = true   # 直接在页面内通过 XHR + ProtectedSend (bidiChannel) 执行 batchexecute RPC 与 StreamChat
browser_recaptcha_settle_seconds = 3.0  # 自定义站点分数测试在 reload/clr 就绪后的额外稳态等待
browser_flow_page_warmup_seconds = 6.0  # 打开 Flow 页面后的稳定等待
browser_count = 1  # Camoufox 浏览器槽位数量
browser_captcha_max_retries = 5  # 单次获取验证码的最大重试次数
browser_captcha_generation_retries = 6  # 生成接口遇到 reCAPTCHA evaluation failed 时的总重试次数
personal_project_pool_size = 4  # 单个 Token 默认维护的项目池数量
browser_personal_fresh_restart_every_n_solves = 10  # 成功获取多少个码后清理并重启浏览器，0 表示禁用
